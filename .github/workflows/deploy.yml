name: Deploy PHP API to Hostinger

on:
  push:
    branches: [sit/php/api]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy package
        run: |
          mkdir -p deploy
          cp contact.php .htaccess config.example.php deploy/
          cp -r src deploy/src

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: sit/portfolio/api/v1/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
