name: Deploy SIT UI to Hostinger

on:
  push:
    branches: [SIT/angular]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration sit --base-href /sit/portfolio/ui/v1/

      - name: Force SIT noindex robots.txt
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/portfolio/browser/robots.txt

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/portfolio/browser/
          server-dir: sit/portfolio/ui/v1/
          exclude: |
            **/.git
            **/.git/**
            **/.gitignore
            **/.env
            **/.env.*
