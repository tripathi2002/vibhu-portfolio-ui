name: Deploy Production UI to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration production --base-href /prod/vibhu/portfolio/

      - name: Allow indexing robots.txt
        run: |
          printf 'User-agent: *\nAllow: /\nSitemap: https://vibhu.pro/prod/vibhu/portfolio/sitemap.xml\n' > dist/portfolio/browser/robots.txt

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/portfolio/browser/
          server-dir: prod/vibhu/portfolio/
