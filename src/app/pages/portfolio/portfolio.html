<section class="section">
  <div class="container portfolio-layout">
    <div class="portfolio-layout__hero">
      <app-page-hero [title]="page.title" />
      <img
        class="portfolio-layout__image"
        src="images/portfolio-hero.jpg"
        alt=""
        width="670"
        height="670"
      />
    </div>

    <div class="portfolio-layout__main">
      <h2 class="section-title">{{ page.subtitle }}</h2>

      <div class="portfolio-projects">
        @for (item of gallery; track item.href) {
          <article class="portfolio-project">
            <a
              class="portfolio-project__media"
              [href]="item.href"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img [src]="item.image" [alt]="item.alt" loading="lazy" />
            </a>
            <h3 class="portfolio-project__title">
              <a [href]="item.href" target="_blank" rel="noopener noreferrer">{{ item.title }}</a>
            </h3>
          </article>
        }
      </div>

      <div class="portfolio-layout__cta">
        <h2 class="section-title">Have a project in mind?</h2>
        <p class="section-lead">Tell me what you’re building — I’ll get back to you soon.</p>
        <a class="btn btn--primary" routerLink="/contact">Get in touch</a>
      </div>
    </div>
  </div>
</section>
