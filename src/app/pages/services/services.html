<section class="section">
  <div class="container">
    <app-page-hero [title]="page.title" />

    <div class="services__intro">
      <h2 class="section-title">{{ page.intro.title }}</h2>
      <p class="section-lead">{{ page.intro.description }}</p>
    </div>

    <div class="service-grid services__grid">
      @for (service of services; track service.title) {
        <article class="service-card">
          <h3 class="service-card__title">{{ service.title }}</h3>
          <p>{{ service.description }}</p>
        </article>
      }
    </div>

    <div class="services__work">
      <h2 class="section-title">{{ page.latestWorkTitle }}</h2>

      <div class="work-grid">
        @for (project of latestWork; track project.href) {
          <article class="work-card">
            <img [src]="project.image" [alt]="project.alt" loading="lazy" />
            <h3 class="work-card__title">{{ project.title }}</h3>
            <a
              class="btn btn--outline"
              [href]="project.href"
              target="_blank"
              rel="noopener noreferrer"
            >
              View project
            </a>
          </article>
        }
      </div>
    </div>
  </div>
</section>
