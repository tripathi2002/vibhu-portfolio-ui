<footer class="site-footer">
  <div class="site-footer__primary container">
    <div class="site-footer__col">
      <p class="site-footer__brand">
        <strong>{{ site.name }} · Full-Stack Developer (Node.js · React)</strong>
      </p>
      <p>{{ footer.blurb }}</p>
    </div>

    <div class="site-footer__col">
      <h2 class="site-footer__title">Social</h2>
      <ul class="site-footer__list">
        @for (link of social; track link.href) {
          <li>
            <a [href]="link.href" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
          </li>
        }
      </ul>
    </div>

    <div class="site-footer__col">
      <h2 class="site-footer__title">Services</h2>
      <ul class="site-footer__list">
        @for (item of serviceLinks; track item.label) {
          <li>
            <a [routerLink]="item.path">{{ item.label }}</a>
          </li>
        }
        <li>
          <a routerLink="/privacy-policy">Privacy Policy</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="site-footer__bottom">
    <div class="container">
      <p>{{ footer.copyright }}</p>
    </div>
  </div>
</footer>
